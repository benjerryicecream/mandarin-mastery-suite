<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c0e">
<meta name="description" content="Mandarin Mastery Suite — 200 flashcards, quizzes, tone drills, stroke practice, dialogues and a phrasebook for absolute beginners learning Simplified Mandarin.">
<title>Mandarin Mastery Suite</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0c0e'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='%235fd3ac' font-family='sans-serif'%3E%E6%B1%89%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <button class="icon-btn" id="backBtn" type="button" aria-label="Go back" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <a class="brand" href="#/today" aria-label="Mandarin Mastery home">
      <span class="brand-mark">汉</span>
      <span class="brand-text">Mandarin Mastery</span>
    </a>
    <button class="icon-btn audio-btn" id="audioBtn" type="button" aria-label="Audio status">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span class="audio-dot" id="audioDot" aria-hidden="true"></span>
    </button>
  </header>

  <main id="main" tabindex="-1"></main>

  <nav class="tabbar" id="tabbar" aria-label="Main">
    <a href="#/today" data-tab="today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Today</span>
    </a>
    <a href="#/cards" data-tab="cards">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="12" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 3.5h9.5a2 2 0 012 2V16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Cards</span>
    </a>
    <a href="#/quiz" data-tab="quiz">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 12.3l2.7 2.7L16.4 9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Quiz</span>
    </a>
    <a href="#/tones" data-tab="tones">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14c2.5 0 2.5-6 5-6s2.5 8 5 8 2.5-6 6-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Tones</span>
    </a>
    <a href="#/more" data-tab="more">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="18" cy="12" r="1.6" fill="currentColor"/></svg>
      <span>More</span>
    </a>
  </nav>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="modalRoot"></div>
<noscript><p style="padding:24px;color:#eee;font-family:sans-serif">This app needs JavaScript enabled.</p></noscript>

<script src="js/data-cards.js"></script>
<script src="js/data-content.js"></script>
<script src="js/core.js"></script>
<script src="js/views.js"></script>
<script src="js/views2.js"></script>
<script src="js/app.js"></script>
</body>
</html>
